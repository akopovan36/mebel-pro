<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мебель PRO</title><style>body{font:16px system-ui;margin:0;background:#f2f5f2;color:#203b2e}header{padding:18px;background:#20573c;color:white;font-size:22px;font-weight:bold}main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}section{background:white;border-radius:12px;padding:18px}label{display:block;margin-top:12px}input,select,button{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccd7cc;border-radius:7px;font:inherit}button{margin-top:12px;background:#267b53;color:white;border:0}svg{width:100%;height:380px;background:#f7faf7}#price{font-size:26px;font-weight:bold;color:#17633e}@media(max-width:700px){main{grid-template-columns:1fr}svg{height:280px}}</style></head><body><header>Мебель PRO · Конструктор 0.2</header><main><section><h3>Параметры шкафа</h3><label>Ширина, мм<input id="w" type="number" value="2400" min="400"></label><label>Высота, мм<input id="h" type="number" value="2600" min="400"></label><label>Глубина, мм<input id="d" type="number" value="600" min="200"></label><label>Секций<input id="s" type="number" value="3" min="1" max="8"></label><label>Полок в секции<input id="p" type="number" value="4" min="0" max="12"></label><label>ЛДСП<select id="mat"><option value="1150">Белый · 1150 ₽/м²</option><option value="1450">Дуб · 1450 ₽/м²</option><option value="1950">Графит · 1950 ₽/м²</option></select></label><label>Фасады<select id="fac"><option value="0">Без фасадов</option><option value="1750">ЛДСП · 1750 ₽/м²</option><option value="3900">МДФ · 3900 ₽/м²</option></select></label><label>Наценка, %<input id="margin" type="number" value="25"></label><button onclick="save()">Сохранить на устройстве</button><button onclick="load()">Открыть сохранённый</button><button onclick="exportCSV()">Скачать расчёт CSV</button></section><section><h3>Изометрическая модель</h3><svg id="model" viewBox="0 0 650 450" preserveAspectRatio="xMidYMid meet"></svg><p>Предварительный эскиз, не производственный чертёж.</p><h3>Предварительный расчёт</h3><div id="detail"></div><div id="price"></div><small>Демонстрационные цены. Кромка, крепёж, присадка и раскрой не учтены.</small></section></main><script>let fields=['w','h','d','s','p','mat','fac','margin'],get=id=>document.getElementById(id),v=id=>+get(id).value;let breakdown=[];function update(){let w=Math.max(400,v('w')),h=Math.max(400,v('h')),d=Math.max(200,v('d')),s=Math.max(1,Math.min(8,v('s'))),p=Math.max(0,Math.min(12,v('p'))),sc=Math.min(470/(w+d*.45),340/(h+d*.22)),W=w*sc,H=h*sc,D=d*sc*.45,V=d*sc*.22,X=(650-W-D)/2+D,Y=(450-H-V)/2+V,wood=get('mat').selectedIndex===1,dark=get('mat').selectedIndex===2,color=dark?'#798080':wood?'#c8a57b':'#e8e8e2';let poly=(pts,fill)=>'<polygon points="'+pts.map(a=>a.join(',')).join(' ')+'" fill="'+fill+'" stroke="#69786e" stroke-width="1.5"/>';let html=poly([[X,Y],[X+D,Y-V],[X+W+D,Y-V],[X+W,Y]],'#d3d9d3')+poly([[X+W,Y],[X+W+D,Y-V],[X+W+D,Y+H-V],[X+W,Y+H]],'#a5aea5')+poly([[X,Y],[X+W,Y],[X+W,Y+H],[X,Y+H]],color);for(let i=1;i<s;i++){let x=X+W*i/s;html+='<line x1="'+x+'" y1="'+Y+'" x2="'+x+'" y2="'+(Y+H)+'" stroke="#69786e" stroke-width="2"/>'}if(!v('fac'))for(let i=0;i<s;i++)for(let j=1;j<=p;j++){let yy=Y+H*j/(p+1);html+='<line x1="'+(X+W*i/s)+'" y1="'+yy+'" x2="'+(X+W*(i+1)/s)+'" y2="'+yy+'" stroke="#69786e" stroke-width="2"/>'}get('model').innerHTML=html;let area=(2*w*h+2*d*h+2*w*d+(s-1)*d*h+s*p*(w/s-32)*d)/1e6,body=area*v('mat'),front=w*h/1e6*v('fac'),work=3500+s*450+p*s*95,total=(body+front+work)*(1+v('margin')/100),rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';breakdown=[['ЛДСП, м²',area.toFixed(2)],['Корпус',rub(body)],['Фасады',rub(front)],['Работы (условно)',rub(work)],['Наценка',v('margin')+'%'],['Итого',rub(total)]];get('detail').innerHTML=breakdown.slice(0,-1).map(x=>'<p>'+x.join(': ')+'</p>').join('');get('price').textContent=rub(total)}fields.forEach(id=>get(id).addEventListener('input',update));function save(){localStorage.setItem('mebel-pro',JSON.stringify(Object.fromEntries(fields.map(id=>[id,get(id).value]))));alert('Сохранено в этом браузере')}function load(){let data=JSON.parse(localStorage.getItem('mebel-pro')||'null');if(!data)return alert('Нет сохранённого проекта');fields.forEach(id=>get(id).value=data[id]??get(id).value);update()}function exportCSV(){let rows=[...fields.map(id=>[id,get(id).value]),...breakdown],blob=new Blob(['\ufeff'+rows.map(x=>x.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mebel-pro.csv';a.click();URL.revokeObjectURL(a.href)}update()</script></body></html>
